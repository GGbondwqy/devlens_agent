name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Init fixture repo (git main + pr-42)
        run: python scripts/setup_fixtures.py

      - name: Run tests (offline, mock LLM)
        run: python -m pytest tests/ -q

      - name: Offline eval (3 scenarios must score 100)
        run: python -m devlens.cli eval
