[project]
name = "devlens-agent"
version = "0.1.0"
description = "DevLens Agent —— 面向企业研发流程的多智能体代码协作框架（Issue 分析 / PR 评审 / CI 排障）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "rich>=13.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
devlens = "devlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
